apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: markdownlint-{{repo_name}}
  annotations:
    pipelinesascode.tekton.dev/on-cel-expression: |
      ( event == "pull_request" || ( event == "push" && source_branch == "main") ) && ( body.sender.login != "livewyer-bot" && body.sender.login != "lw-tkn[bot]" )
    pipelinesascode.tekton.dev/on-target-branch: "[main]"

spec:
  pipelineRef:
    resolver: cluster
    params:
      - name: kind
        value: pipeline
      - name: name
        value: markdownlint

  params:
    - name: url
      value: "{{repo_url}}"
    - name: revision
      value: "{{revision}}"
    - name: fileName
      value: "Chart.yaml"

  workspaces:
    - name: basic-auth
      secret:
        secretName: "{{git_auth_secret}}"
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 128Mi

  taskRunTemplate:
    serviceAccountName: pipelines-as-code-runner
    podTemplate:
      securityContext:
        fsGroup: 65532
