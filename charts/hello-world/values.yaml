# -- Sets number of pods to be created.
replicaCount: 1

# -- Image settings
image:
  # -- Repository of the image.
  repository: nginx
  # -- Sets pull policy of the image.
  pullPolicy: IfNotPresent
  # -- Overrides the image tag whose default is the chart appVersion.
  tag: ""

# -- Kubernetes secrets with register credentials.
imagePullSecrets: []
# -- Overrides the default name of the chart.
nameOverride: ""
# -- Overrides the default fully qualified app name.
fullnameOverride: ""

# -- Service account settings
serviceAccount:
  # -- Specifies whether a service account should be created.
  create: true
  # -- Annotations to add to the service account.
  annotations: {}
  # -- The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

# -- Adds custom pod annotations.
podAnnotations: {}

# -- Sets security context for the pod.
podSecurityContext: {}
  # fsGroup: 2000

# -- Sets security context for a specific container of the pod.
securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# -- Service settings
service:
  # -- Type of the service.
  # @default to ClusterIP
  type: ClusterIP
  # -- Sets port to expose.
  port: 80

# -- Ingress settings
ingress:
  # -- Specifies whether a ingress objects should be created.
  enabled: false
  # -- Sets a default ingress class name.
  className: ""
  # Adds custom annotations to ingress object.
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  # -- Hosts settings
  hosts:
    # -- URL of the host.
    - host: chart-example.local
      # -- Path settings
      paths:
        # -- Each path has a backend service behind it.
        - path: /
          # -- Path type
          # Ref. <https://kubernetes.io/docs/concepts/services-networking/ingress/#path-types>
          pathType: ImplementationSpecific
  # -- TLS settings
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# -- Resources usage
resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# -- Autoscaling settings
autoscaling:
  # -- Specifies whether an autoscaler object should be created.
  enabled: false
  # -- Sets minimum replicas of the app.
  minReplicas: 1
  # -- Sets maximum replicas of the app.
  maxReplicas: 100
  # -- Autoscaler keeps the average CPU utilization of the pods in this scaling target.
  # Ref. <https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/>
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# -- Node selection constraint.
# Ref. <https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector>
nodeSelector: {}

# -- Allow the scheduler to schedule pods with matching taints.
# Ref. <https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/>
tolerations: []

# -- Expands the types of constraints you can define.
# Ref. <https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity>
affinity: {}
