{{- range $issuer, $name := .Values.issuers.objects -}}
apiVersion: {{ .Values.issuers.apiVersion }}
kind: {{ $name.kind }}
metadata:
  name: $issuer
  labels: {{- include "helper.labels" ( dict "customLabels" .Values.issuers.commonLabels "context" $ ) | nindent 4 }}
  annotations: {{- include "helper.render" ( dict "value" .Values.issuers.commonAnnotations "context" $ ) | nindent 4 }}
spec:
  {{- toYaml $name.spec | nindent 2 }}
{{- end -}}