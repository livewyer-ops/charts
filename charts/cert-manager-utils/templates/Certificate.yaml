{{- range $certificate, $name := .Values.certificates.objects -}}
apiVersion: {{ .Values.issuers.apiVersion }}
kind: Certificate
metadata:
  name: $certificate
  namespace: {{ $name.namespace }}
spec:
  {{- with $name.subject }}
  subject:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- if $name.literalSubject }}
  literalSubject: {{ $name.literalSubject }}
  {{- end }}

  {{- if $name.commonName }}
  commonName: {{ $name.commonName }}
  {{- end }}

  duration: {{ default "2160h" $name.duration }} # 90d
  renewBefore: {{ default "360h" $name.renewBefore }} # 15d

  {{- with $name.dnsNames }}
  dnsNames:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- with $name.ipAddresses }}
  ipAddresses:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- with $name.uris }}
  uris:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- with $name.otherNames }}
  otherNames:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- with $name.emailAddresses }}
  emailAddresses:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  emailAddresses:
    - john.doe@cert-manager.io

  secretName: $certificate

  {{- with $name.secretTemplate }}
  secretTemplate:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- with $name.keystores }}
  keystores:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  issuerRef:
    name: {{ $name.issuerRef.name }}
    kind: {{ $name.issuerRef.kind }}
    group: {{ default "cert-manager.io" $name.issuerRef.group }}

  {{- if $name.isCA }}
  isCA: {{ $name.isCA }}
  {{- end }}

  {{- with $name.usages }}
  usages:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- with $name.privateKey }}
  privateKey:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- if $name.encodeUsagesInRequest }}
  encodeUsagesInRequest: {{ $name.encodeUsagesInRequest }}
  {{- end }}

  {{- if $name.revisionHistoryLimit }}
  revisionHistoryLimit: {{ $name.revisionHistoryLimit }}
  {{- end }}

  {{- with $name.additionalOutputFormats }}
  additionalOutputFormats:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- with $name.nameConstraints }}
  nameConstraints:
    {{- toYaml . | nindent 4 }}
  {{- end }}

{{- end -}}